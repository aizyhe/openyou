# Dependabot keeps dependencies up to date.
# Major-version bumps are ignored: they usually break the build (gradle/kotlin/
# plugin upgrades are coupled), so they are handled manually when needed.
# See https://docs.github.com/code-security/dependabot

version: 2
updates:
  # Go module (daemon/ is the module root)
  - package-ecosystem: "gomod"
    directory: "/daemon"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Gradle (Android) — build plugin versions are coupled; only patch/minor
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
