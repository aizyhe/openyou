# Dependabot keeps dependencies up to date.
# See https://docs.github.com/code-security/dependabot

version: 2
updates:
  # Go module (daemon/ is the module root)
  - package-ecosystem: "gomod"
    directory: "/daemon"
    schedule:
      interval: "weekly"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Gradle (Android)
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
