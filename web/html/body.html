</head>
<body>

<div id="app">
  <!-- ============================================================
       Home Page
       ============================================================ -->
  <div id="home-page" class="page active">
    <header style="justify-content:flex-end;min-height:32px;padding:4px 12px">
      <button class="icon-btn" id="btn-open-settings-from-home" title="Settings" aria-label="设置"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button>
    </header>
    <div class="home-scroll" id="home-scroll"></div>
  </div>

  <!-- ============================================================
       Session List Page
       ============================================================ -->
  <div id="consult-page" class="page">
    <header>
      <div class="contextsubtabs" id="consultsubtabs">
        <button class="contextsubtab active" data-ksub="new">New</button>
        <button class="contextsubtab" data-ksub="history">History</button>
        <button class="contextsubtab" data-ksub="memory">Memory</button>
      </div>
    </header>
    <!-- New sub-page: fresh chat interface -->
    <div id="consult-new" class="consult-sub" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div style="display:flex;align-items:center;padding:4px 12px">
        <span class="session-title-area" id="chat-title" style="flex:1;text-align:center">New Consult</span>
        <button class="add-btn" id="btn-chat-new" title="New Consult">+</button>
      </div>
      <div class="retry-banner" id="retry-banner">Streaming interrupted. <u>Retry?</u></div>
      <div id="chat-context"></div>
      <div class="chat-messages" id="chat-messages"></div>
      <div id="thinking-indicator" class="thinking-indicator" style="display:none">
        <div class="dots"><span></span><span></span><span></span></div>
        <span>Analyzing...</span>
      </div>
      <div class="conn-status disconnected" id="conn-status">Reconnecting...</div>
      <div class="br-progress" id="br-progress" style="display:none">
        <div class="br-label">Analyzing… </div>
        <div class="br-skills" id="br-skills-list"></div>
      </div>
      <div class="chat-input-area">
        <div class="chat-input-box">
          <textarea id="chat-input" placeholder="Ask anything..." rows="1" autocomplete="off"></textarea>
        </div>
        <button class="send-btn" id="btn-send">↑</button>
      </div>
      <div style="display:flex;align-items:center;justify-content:flex-end;padding:2px 12px 0">
        <span style="font-size:var(--fs-sm);color:var(--text-hint)"></span>
        <span id="chat-char-counter" style="font-size:var(--fs-sm);color:var(--text-hint)"></span>
      </div>
      <div style="font-size:var(--fs-sm);color:var(--text-hint);padding:2px 0 0;text-align:center"></div>
    </div>
    <!-- History sub-page: past sessions list -->
    <div id="consult-history" class="consult-sub" style="display:none;flex:1;min-height:0">
      <div class="search-bar">
        <input type="text" id="session-search" placeholder="Search..." autocomplete="off">
      </div>
      <div class="session-list" id="session-list"></div>
      <div class="empty-state" id="sessions-empty" style="display:none">No consults yet.</div>
    </div>
    <!-- Memory sub-page: memories extracted from conversations -->
    <div id="consult-memory" class="consult-sub" style="display:none;flex:1;min-height:0">
      <div class="search-bar">
        <input type="text" id="memory-search" placeholder="Search..." autocomplete="off">
      </div>
      <div id="consult-memory-list" style="flex:1;overflow-y:auto;padding:8px 12px 24px;-webkit-overflow-scrolling:touch"></div>
    </div>
  </div>

  <!-- ============================================================
       Chat Page
       ============================================================ -->
  <div id="settings-page" class="page">
    <header>
      <button class="icon-btn" id="btn-back-from-settings" title="Back">←</button>
      <h1 style="text-align:center;flex:1">Settings</h1>
      <div></div>
    </header>
    <div class="settings-scroll" id="settings-scroll"></div>
  </div>

  <!-- ============================================================
       Skills Management
       ============================================================ -->
  <div id="skills-page" class="page">
    <header>
      <button class="icon-btn" id="btn-back-from-skills" title="Back">←</button>
      <h1>Skills</h1>
      <button class="add-btn" id="btn-add-skill" title="New Skill">+</button>
    </header>
    <div class="skills-list" id="skills-list"></div>
  </div>

  <!-- ============================================================
       Context Page
       ============================================================ -->
  <div id="context-page" class="page">
    <header>
      <div class="contextsubtabs" id="contextsubtabs">
        <button class="contextsubtab active" data-ksub="inside">Inside</button>
        <button class="contextsubtab" data-ksub="rule">Rule</button>
        <button class="contextsubtab" data-ksub="skill">Skill</button>
      </div>
    </header>
    <div class="context-content" id="context-content"></div>
  </div>

  <!-- ============================================================
       Task List Page
       ============================================================ -->
  <div id="time-page" class="page">
    <header>
      <div class="contextsubtabs" id="timesubtabs">
        <button class="contextsubtab active" data-ksub="star">Star</button>
        <button class="contextsubtab" data-ksub="task">Task</button>
        <button class="contextsubtab" data-ksub="calendar">Calendar</button>
      </div>
    </header>
    <!-- Star sub-page: one-tap Do advisor + suggestion card -->
    <div id="time-star" class="time-sub">
      <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:32px">
        <div id="star-result" class="star-result" style="display:none;margin-bottom:16px"></div>
        <div style="display:flex;justify-content:center">
          <button id="btn-star" class="star-btn" title="Star — what to do now">✦</button>
        </div>
      </div>
    </div>
    <!-- Tasks sub-page: editable task list + add row -->
    <div id="time-task" class="time-sub" style="display:none">
      <div class="task-add-row" style="margin-top:0;padding:8px 12px">
        <input type="text" id="task-add-title" placeholder="Add task…" autocomplete="off" style="flex:1;min-width:0">
        <input type="datetime-local" id="task-add-end" placeholder="Set time…">
        <button id="btn-task-add" class="add-btn">+</button>
      </div>
      <div id="task-list"></div>
    </div>
    <!-- Calendar sub-page: month view with brief task info -->
    <div id="time-calendar" class="time-sub" style="display:none">
      <div id="cal-header" style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px">
        <button id="cal-prev" class="btn btn-cancel" style="font-size:var(--fs-sm)" onclick="calMove(-1)">‹</button>
        <span id="cal-title" style="font-weight:600"></span>
        <button id="cal-next" class="btn btn-cancel" style="font-size:var(--fs-sm)" onclick="calMove(1)">›</button>
      </div>
      <div id="cal-grid" style="padding:0 12px"></div>
    </div>
  </div>

  <!-- ============================================================
       Context Menu
       ============================================================ -->
  <div id="context-menu-backdrop" style="display:none;position:fixed;inset:0;z-index:calc(var(--z-context-menu) - 1)"></div>
  <div class="context-menu" id="context-menu">
    <div class="menu-item" data-action="copy">Copy</div>
    <div class="menu-item" data-action="edit">Edit</div>
    <div class="menu-item danger" data-action="delete">Delete</div>
    <div class="menu-item" data-action="regenerate">Regenerate</div>
  </div>

  <!-- ============================================================
       Modals
       ============================================================ -->
  <div class="modal-overlay" id="modal-rename" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Rename Consult</h3>
        <button class="icon-btn" onclick="closeModal('modal-rename')">×</button>
      </div>
      <div class="modal-body">
        <input type="text" id="rename-input" placeholder="Enter new name..." autocomplete="off">
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancel" onclick="closeModal('modal-rename')">Cancel</button>
        <button class="btn btn-primary" id="btn-rename-confirm">Rename</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-delete" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Delete Consult?</h3>
        <button class="icon-btn" onclick="closeModal('modal-delete')">×</button>
      </div>
      <div class="modal-body">
        <p>This cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancel" onclick="closeModal('modal-delete')">Cancel</button>
        <button class="btn btn-danger" id="btn-delete-confirm">Delete</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
       Toast
       ============================================================ -->
  <div class="toast" id="toast"></div>

  <!-- ============================================================
       Bottom Tab Bar
       ============================================================ -->
<div class="tab-bar">
<button class="tab-btn active" data-tab="home" aria-label="Home">
  <!-- The one logo (web/logo.svg), same design at every size. -->
  <svg width="22" height="22" viewBox="0 0 128 128" style="border-radius:20%"><use href="#logo-y"/></svg>
  <span class="tab-label">Home</span>
</button>
<button class="tab-btn" data-tab="time" aria-label="Time &amp; Tasks"><svg class="tab-icon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span class="tab-label">Time</span></button>
<button class="tab-btn" data-tab="context" aria-label="Context"><svg class="tab-icon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span class="tab-label">Context</span></button>
<button class="tab-btn" data-tab="consult" aria-label="Consult"><svg class="tab-icon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="tab-label">Consult</span></button>
  </div>
</div>
