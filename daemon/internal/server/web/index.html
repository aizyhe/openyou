      .then(() => { showToast('Skill deleted'); if (_skillsRefreshFn) _skillsRefreshFn(); else renderSkillsPage(); })
      .catch(() => showToast('Delete failed', 'warn'));
  });
}

let _brProgressTimer = null;

let _skillsRefreshFn = null;

// ---- web/js/core/ws.js ----
function ensureWebSocket() {
  if (state.ws && (state.ws.readyState === WebSocket.OPEN || state.ws.readyState === WebSocket.CONNECTING)) {
    return;
  }
  connectWebSocket();
}

function connectWebSocket() {
  if (state.ws) {
    state.ws.onclose = null;
    state.ws.onerror = null;
    state.ws.onmessage = null;
    try { state.ws.close(); } catch(e) {}
  }

  const url = 'ws://127.0.0.1:8765/ws';
  updateConnStatus('connecting');
  try {
    state.ws = new WebSocket(url);
  } catch (e) {
    scheduleReconnect();
    return;
  }

  state.ws.onopen = function() {
    state.isConnected = true;
    state.wsReconnectDelay = 1000;
    updateConnStatus('connected');
    showToast('Connected', '');
    setTimeout(() => { const t = $('#toast'); t.classList.remove('show'); }, 1500);

    flushSendQueue();
    sendWS({ type: 'sync-sessions' });

    // Daemon is the source of truth for api_key/model/base_url.
    syncDaemonConfig();
  };

  state.ws.onmessage = function(event) {
    handleWSMessage(event.data);
  };

  state.ws.onclose = function(event) {
    state.isConnected = false;
    updateConnStatus('disconnected');
    if (event.code !== 1000) {
      scheduleReconnect();
    }
  };

  state.ws.onerror = function() {
    state.isConnected = false;
    updateConnStatus('disconnected');
  };
}

function sendWS(data) {
  if (data.type === 'chat') {
    // FE-8: cancel any pending hide timer when a new request starts.
    clearTimeout(_brProgressTimer);
    _brProgressTimer = null;
    $('#br-progress').style.display = 'block';
    $('#br-skills-list').innerHTML = '';
    state.thinkTankSkills = [];
    state.llmSendTime = performance.now();
    // handleDone runs for both the "done" JSON event and the [DONE] sentinel
    // (analyze may emit more) — the guard makes only the first take effect.
    state._streamActive = true;
    state._streamGotContent = false;
    state._streamBackgrounded = false;
    // Baseline the suggested-memory count NOW so the post-stream notice only
    // counts memories created by THIS conversation (0 would report all existing).
    fetch('/api/memory').then(r => r.json()).then(d => {
      const all = (d && d.memories) || [];
      state._lastSuggestedCount = all.filter(m => m.suggested && !m.confirmed).length;
    }).catch(() => {});
    fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: data.message, session_id: data.session_id || state.currentSessionId })
    }).then(r => {
      if (!r.ok) {
        // handleError does the full cleanup — duplicating part of it here
        // left a blank bubble persisted and a dirty streamingSessionId behind.
        return r.text().then(t => handleError({ error: t || ('HTTP ' + r.status) }));
      }
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      function pump() {
        reader.read().then(({done, value}) => {
          if (done) { handleDone({}); return; }
          buf += decoder.decode(value, {stream: true});
          const lines = buf.split('\n');
          buf = lines.pop();
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const payload = line.slice(6);
              if (payload === '[DONE]') { handleDone({}); return; }
              handleWSMessage(payload);
            }
          }
          pump();
        }).catch(e => {
          // If the stream died while backgrounded (screen off: ArkWeb suspends
          // the network) and nothing arrived, that's power-saving — finalize quietly.
          if (!state._streamGotContent && state._streamBackgrounded) {
            state._streamActive = false;
            setStreaming(false);
            showThinking(false);
            $('#br-progress').style.display = 'none';
            state.thinkTankSkills = [];
            const sid = state.streamingSessionId || state.currentSessionId;
            const s = getSession(sid);
            if (s) {
              const last = s.messages[s.messages.length - 1];
              if (last && last.role === 'assistant' && !last.content) {
                s.messages.pop();
                saveSessions();
              }
            }
            state.streamingSessionId = null;
            if (sid === state.currentSessionId) renderChatMessages();
            return;
          }
          setStreaming(false);
          handleDone({interrupted: true});
        });
      }
      pump();
    }).catch(e => {
      handleError({ error: 'Consult error: ' + e.message });
    });
    return;
  }
  if (state.ws && state.ws.readyState === WebSocket.OPEN) {
    state.ws.send(JSON.stringify(data));
  } else if (data.type === 'sync-sessions') {
    scheduleReconnect();
  }
}

function scheduleReconnect() {
  if (state.wsReconnectTimer) return;
  updateConnStatus('connecting');
  state.wsReconnectTimer = setTimeout(() => {
    state.wsReconnectTimer = null;
    state.wsReconnectDelay = Math.min(state.wsReconnectDelay * 2, 5000);
    connectWebSocket();
  }, state.wsReconnectDelay);
}

function updateConnStatus(status) {
  const el = $('#conn-status');
  el.className = 'conn-status ' + status;
  if (status === 'disconnected') {
    el.textContent = 'Reconnecting...';
  } else if (status === 'connecting') {
    el.textContent = 'Connecting...';
  }
}

function handleWSMessage(raw) {
  let data;
  try { data = JSON.parse(raw); } catch(e) { return; }

  switch (data.type) {
    case 'text-delta':
      handleTextDelta(data);
      break;
    case 'tool-call':
      handleToolCall(data);
      break;
    case 'tool-result':
      handleToolResult(data);
      break;
    case 'done':
      handleDone(data);
      break;
    case 'source-citations':
      if (data.citations && Array.isArray(data.citations)) {
        state.lastCitations = data.citations;
      }
      break;
    case 'error':
      handleError(data);
      break;
    case 'sync-sessions':
      if (data.sessions && Array.isArray(data.sessions)) {
        data.sessions.forEach(ss => {
          if (ss.updated_at !== undefined && ss.updatedAt === undefined) ss.updatedAt = ss.updated_at;
          if (ss.created_at !== undefined && ss.createdAt === undefined) ss.createdAt = ss.created_at;
        });
        data.sessions.forEach(ss => {
          if (!getSession(ss.id)) {
            state.sessions.push(ss);
          }
        });
        state.sessions.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        saveSessions();
        if (state.currentPage === 'consult') renderSessionList();
      }
      break;
    case 'diagnostics':
      handleDiagnostics(data);
      break;
    case 'memories-extracted':
      showToast(data.body || 'Memories extracted', 'info');
      if (state.currentPage === 'consult') loadContextMemories();
      break;
    case 'context-health':
      if (data.issues && data.issues.length > 0) {
        showToast('Context health: ' + data.issues.length + ' issue(s) found', 'alert');
        if (state.currentPage === 'context') renderContextPage();
      }
      break;
    case 'thinktank-start':
      handleThinkTankStart(data);
      break;
    case 'skill-progress':
      handleSkillProgress(data);
      break;
    case 'skill-result':
      handleSkillResult(data);
      break;
    case 'synthesis-delta':
      handleSynthesisDelta(data);
      break;
    case 'conflict':
      handleConflict(data);
      break;
    case 'context-loaded':
      handleContextLoaded(data);
      break;
    default:
      break;
  }
}

function handleThinkTankStart(data) {
  showThinking(false);
  const skills = data.skills || [];
  state.thinkTankSkills = skills.map(s => ({ name: s.name || s, status: 'analyzing' }));
  renderThinkTankBadges();
  // Bind the note to the streaming session, not whatever is on screen now.
  const s = getSession(state.streamingSessionId || state.currentSessionId);
  if (s) {
    const last = s.messages[s.messages.length - 1];
    if (last && last.role === 'assistant') {
      last.content = '**ThinkTank activated** — ' + skills.length + ' skills analyzing:\n' +
        skills.map(sk => '- ' + (sk.name || sk)).join('\n') + '\n\n';
    }
    saveSessions();
  }
}

function handleSkillProgress(data) {
  const skill = data.skill;
  const status = data.status || 'analyzing';
  const idx = state.thinkTankSkills.findIndex(s => s.name === skill);
  if (idx >= 0) state.thinkTankSkills[idx].status = status;
  renderThinkTankBadges();
}

function handleSkillResult(data) {
  const skill = data.skill;
  const result = data.result || '';
  const sid = state.streamingSessionId || state.currentSessionId;

  if (sid === state.currentSessionId) {
    const container = $('#chat-messages');
    const existing = container.querySelector('.br-result-card[data-skill="' + cssAttrEscape(skill) + '"]');
    if (existing) {
      const body = existing.querySelector('.br-skill-body');
      if (body) body.textContent = result;
    } else {
      const card = document.createElement('div');
      card.className = 'br-result-card';
      card.dataset.skill = skill;
      card.innerHTML = '<div class="br-skill-name" onclick="this.parentElement.classList.toggle(\'expanded\')">' + escHtml(skill) + '</div>' +
        '<div class="br-skill-body">' + escHtml(result) + '</div>';
      container.appendChild(card);
    }
    scrollChatBottom(state.isStreaming);
  }
  const s = getSession(sid);
  if (s) {
    const last = s.messages[s.messages.length - 1];
    if (last && last.role === 'assistant') {
      last.content = (last.content || '') + '\n**' + skill + '**: ' + result + '\n';
    }
    saveSessions();
  }
}

function handleSynthesisDelta(data) {
  handleTextDelta({ text: data.text || '' });
}

function handleConflict(data) {
  const banner = document.createElement('div');
  banner.className = 'br-conflict';
  banner.innerHTML = '<div class="br-conflict-label">Disagreement: ' + escHtml(data.skill_a || 'Skill A') + ' vs ' + escHtml(data.skill_b || 'Skill B') + '</div>' +
    '<div class="br-conflict-desc">' + escHtml(data.description || '') + '</div>';
  $('#chat-messages').appendChild(banner);
  scrollChatBottom(state.isStreaming);
}

function handleContextLoaded(data) {
  state.contextData = {
    peopleNames: data.people_names || [],
    peopleCount: data.people_count || 0,
    rulesCount: data.rules_count || 0,
    memoryCount: data.memory_count || 0,
  };
  renderContextPills();
}

function renderContextPills(activePerson) {
  if (!activePerson) return;
  const container = $('#chat-context');
  if (!container) return;
  var ctx = state.contextData || {};
  var html = '<span class="ctx-label">Context:</span>';
  if (ctx.peopleCount > 0) {
    html += '<span class="ctx-pill person-pill' + (ctx.peopleNames && ctx.peopleNames.some(n => n === activePerson) ? ' active' : '') + '" role="button" tabindex="0">People <span class="ctx-count">' + ctx.peopleCount + '</span></span>';
  }
    if (ctx.rulesCount > 0) {
      html += '<span class="ctx-pill" role="button" tabindex="0">Rules <span class="ctx-count">' + ctx.rulesCount + '</span></span>';
    }
  if (ctx.memoryCount > 0) {
    html += '<span class="ctx-pill" role="button" tabindex="0">Memory <span class="ctx-count">' + ctx.memoryCount + '</span></span>';
  }
  container.innerHTML = html;
}

function checkPersonMention(text) {
  if (!state.contextData || !state.contextData.peopleNames || state.contextData.peopleNames.length === 0) return;
  const found = state.contextData.peopleNames.find(function(name) {
    return text.indexOf(name) !== -1;
  });
  renderContextPills(found || null);
}

function renderThinkTankBadges() {
  const list = $('#br-skills-list');
  list.innerHTML = state.thinkTankSkills.map(s =>
    '<span class="br-skill-badge ' + escHtml(s.status) + '">' +
      escHtml(s.name) +
    '</span>'
  ).join('');
}

function handleTextDelta(data) {
  state._streamGotContent = true;
  showThinking(false);
  if (state.llmSendTime > 0) {
    const latency = Math.round(performance.now() - state.llmSendTime);
    state.llmSendTime = 0;
    state.llmLatencies.push(latency);
    if (state.llmLatencies.length > 10) state.llmLatencies.shift();
    const avg = Math.round(state.llmLatencies.reduce((a,b) => a+b, 0) / state.llmLatencies.length);
    updateSettingsDisplay('diag--latency', '~' + avg + 'ms');
  }
  const text = data.text || '';
  // Only touch the DOM when the streaming session is still displayed; binding
  // to streamingSessionId prevents cross-session bleed if the user switched away.
  const sid = state.streamingSessionId || state.currentSessionId;
  updateLastAssistantMsg(sid, text, undefined, undefined);
  if (sid === state.currentSessionId) appendTextDelta(text);
}

function handleToolCall(data) {
  showThinking(true);
  const sid = state.streamingSessionId || state.currentSessionId;
  const s = getSession(sid);
  if (!s) return;
  const last = s.messages[s.messages.length - 1];
  if (last && last.role === 'assistant') {
    last.tools = last.tools || [];
    const existing = last.tools.find(t => t.tool === data.tool && t.args === data.args);
    if (!existing) {
      last.tools.push({ tool: data.tool, name: data.tool, args: data.args, output: null });
    }
    saveSessions();

    if (sid !== state.currentSessionId) return;
    const bubbles = $$('.msg.assistant .msg-bubble', $('#chat-messages'));
    if (bubbles.length > 0) {
      const lastBubble = bubbles[bubbles.length - 1];
      const existingCard = lastBubble.querySelector(`.tool-card[data-tool="${cssAttrEscape(data.tool)}"]`);
      if (!existingCard) {
        const card = document.createElement('div');
        card.className = 'tool-card';
        card.dataset.tool = data.tool;
        card.innerHTML = `<span class="tool-label">${escHtml(data.tool)}</span>`;
        if (data.args) {
          const argsDiv = document.createElement('div');
          argsDiv.className = 'tool-args';
          argsDiv.textContent = typeof data.args === 'string' ? data.args : JSON.stringify(data.args);
          card.appendChild(argsDiv);
        }
        lastBubble.appendChild(card);
      }
    }
  }
}

function handleToolResult(data) {
  const sid = state.streamingSessionId || state.currentSessionId;
  const s = getSession(sid);
  if (!s) return;
  const last = s.messages[s.messages.length - 1];
  if (last && last.role === 'assistant' && last.tools) {
    const tool = last.tools.find(t => t.tool === data.tool);
    if (tool) {
      tool.output = data.output || data.result || '';
      if (data.error) tool.error = data.error;
    }
    saveSessions();

    if (sid !== state.currentSessionId) return;
    const bubbles = $$('.msg.assistant .msg-bubble', $('#chat-messages'));
    if (bubbles.length > 0) {
      const lastBubble = bubbles[bubbles.length - 1];
      const card = lastBubble.querySelector(`.tool-card[data-tool="${cssAttrEscape(data.tool)}"]`);
      if (card) {
        let outputDiv = card.querySelector('.tool-output');
        if (!outputDiv) {
          outputDiv = document.createElement('div');
          outputDiv.className = 'tool-output';
          card.appendChild(outputDiv);
        }
        if (data.error) {
          outputDiv.innerHTML = `<span style="color:var(--danger)">Error: ${escHtml(data.error)}</span>`;
        } else {
          const out = (data.output || data.result || '');
          outputDiv.textContent = typeof out === 'string' ? out.slice(0, 500) : '';
        }
      }
    }
  }
}

function handleDone(data) {
  // Daemon emits both a "done" event and a [DONE] sentinel per stream — only
  // the first run may act, or the memory notice double-posts on a wrong session.
  if (!state._streamActive) return;
  state._streamActive = false;
  setStreaming(false);
  state.currentStreamingText = '';
  // FE-6: keep home stats fresh — only when home is visible (the old
  // Object.assign was dead code that never refreshed anything).
  if (state.currentPage === 'home') loadHome();

  // FE-8: cancel any pending hide timer before setting a new one.
  clearTimeout(_brProgressTimer);
  _brProgressTimer = setTimeout(() => { $('#br-progress').style.display = 'none'; _brProgressTimer = null; }, 1000);
  state.thinkTankSkills = [];

  // Operate on the session the stream started for (the user may have switched).
  const sid = state.streamingSessionId || state.currentSessionId;
  const s = getSession(sid);
  if (s) {
    const last = s.messages[s.messages.length - 1];
    if (last && last.role === 'assistant') {
      // Drop an empty placeholder so a blank bubble isn't persisted/replayed.
      if (!last.content && !data.interrupted) {
        s.messages.pop();
        saveSessions();
        state.streamingSessionId = null;
        state.lastCitations = null;
        showThinking(false);
        if (sid === state.currentSessionId) renderChatMessages();
        return;
      }
      const citEntries = data.citations || state.lastCitations;
      if (citEntries) last.citations = citEntries;
      state.lastCitations = null;
      last.interrupted = !!data.interrupted;
      saveSessions();
    }
  }
  state.streamingSessionId = null;

  showThinking(false);

  if (!s || sid !== state.currentSessionId) return;

  const bubbles = $$('.msg.assistant .msg-bubble', $('#chat-messages'));
  if (bubbles.length > 0) {
    const lastBubble = bubbles[bubbles.length - 1];
    const lastMsg = s.messages[s.messages.length - 1];
    if (lastMsg && lastMsg.citations && lastMsg.citations.length > 0) {
      let citDiv = lastBubble.querySelector('.citations');
      if (!citDiv) {
        citDiv = document.createElement('div');
        citDiv.className = 'citations';
        const label = document.createElement('div');
        label.className = 'citation-label';
        label.textContent = 'Sources:';
        citDiv.appendChild(label);
        lastBubble.appendChild(citDiv);
      }
      citDiv.querySelectorAll('.citation-item').forEach(el => el.remove());
      lastMsg.citations.forEach(c => {
        const item = document.createElement('div');
        item.className = 'citation-item cite-' + (c.from || 'person');
        item.setAttribute('role', 'button');
        item.setAttribute('tabindex', '0');
        item.textContent = c.title || c.source || c.url || '';
        if (c.url) item.title = c.url;
        citDiv.appendChild(item);
      });
    }

    const parentMsg = lastBubble.closest('.msg');
    if (parentMsg) {
      let timeEl = parentMsg.querySelector('.msg-time');
      if (!timeEl) {
        timeEl = document.createElement('div');
        timeEl.className = 'msg-time';
        parentMsg.appendChild(timeEl);
      }
      let timeText = formatTime(lastMsg.time);
      if (lastMsg.interrupted) timeText += ' (interrupted)';
      timeEl.textContent = timeText;
    }
  }

  if (data.interrupted) {
    $('#retry-banner').classList.add('show');
  }

  flushSendQueue();
  scrollChatBottom(state.isStreaming);

  if (!data.interrupted) {
    const prevSuggestedCount = state._lastSuggestedCount || 0;
    setTimeout(function() {
      fetch('/api/memory')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          const all = d.memories || [];
          const suggested = all.filter(function(m) { return m.suggested && !m.confirmed; });
          state._lastSuggestedCount = suggested.length;
          const newCount = suggested.length - prevSuggestedCount;
          if (newCount > 0) {
            const chatMsgs = $('#chat-messages');
            if (!chatMsgs) return;
            const notice = document.createElement('div');
            notice.className = 'memory-notice';
            // Memory lives on the Consult page's "memory" sub-tab; the old ('context','memories') target matched nothing.
            notice.innerHTML = 'Extracted ' + newCount + ' ' + (newCount === 1 ? 'memory' : 'memories') + '. <span onclick="navigateTo(\'consult\',\'memory\')" style="color:var(--accent-text);cursor:pointer">Review →</span>';
            chatMsgs.appendChild(notice);
            scrollChatBottom(state.isStreaming);
          }
        })
        .catch(function() {});
    }, 2000);
  }
}

function handleError(data) {
  // Consume the stream so any done/[DONE] after an error can't re-run cleanup.
  state._streamActive = false;
  setStreaming(false);
  state.currentStreamingText = '';
  showThinking(false);
  $('#br-progress').style.display = 'none';
  state.thinkTankSkills = [];
  showToast('Error: ' + (data.error || data.message || 'Unknown error'), 'warn');
  $('#retry-banner').classList.add('show');

  const sid = state.streamingSessionId || state.currentSessionId;
  const s = getSession(sid);
  if (s) {
    const last = s.messages[s.messages.length - 1];
    if (last && last.role === 'assistant') {
      if (!last.content) {
        // Nothing streamed — drop the empty placeholder, not leave a blank bubble.
        s.messages.pop();
      } else {
        last.interrupted = true;
      }
      saveSessions();
    }
  }
  state.streamingSessionId = null;
  if (sid === state.currentSessionId) {
    renderChatMessages();
    scrollChatBottom(state.isStreaming);
  }
}

function updateSettingsDisplay(key, value) {
  const row = document.querySelector('.setting-row[data-key="' + key + '"] .setting-disabled');
  if (row) row.textContent = value;
}

async function testConnection() {
  updateSettingsDisplay('diag--status', 'Testing...');
  updateSettingsDisplay('diag--latency', '...');

  // Health check only — the old /api/chat "ping" created a permanent session,
  // burned an LLM call, and later triggered follow-up. Diagnostics must be side-effect-free.
  const healthStart = performance.now();
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 10000);
    const r = await fetch('/api/health', { signal: ctrl.signal });
    clearTimeout(timer);
    if (!r.ok) { throw new Error('HTTP ' + r.status); }
    const healthLatency = Math.round(performance.now() - healthStart);
    state.daemonOnline = true;
    updateSettingsDisplay('diag--status', 'Online (' + healthLatency + 'ms)');
    updateSettingsDisplay('diag--latency', healthLatency + 'ms');
    showToast('Connected · Health ' + healthLatency + 'ms');
  } catch (e) {
    state.daemonOnline = false;
    updateSettingsDisplay('diag--status', 'Offline');
    showToast('Connection failed: ' + (e.name === 'AbortError' ? 'timeout' : e.message), 'error');
  }
}

function handleDiagnostics(data) {
  if (state.currentPage === 'settings') {
    updateSettingsDisplay('diag--status', data.status || 'Connected');
    if (data.latencyMs !== undefined) updateSettingsDisplay('diag--latency', data.latencyMs + 'ms');
    if (data.sessions_count !== undefined) updateSettingsDisplay('diag--sessions', '' + data.sessions_count);
    if (data.memories_count !== undefined) updateSettingsDisplay('diag--memories', '' + data.memories_count);
    if (data.people_count !== undefined) updateSettingsDisplay('diag--people', '' + data.people_count);
  }
}

function navigateToConsult() {
  if (!state.currentSessionId) {
    var empty = state.sessions.find(function(x) { return x.messages.length === 0; });
    var s = empty || createSession();
    state.currentSessionId = s.id;
    var titleEl = document.getElementById('chat-title');
    if (titleEl) titleEl.textContent = s.title;
  }
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  var target = document.getElementById('consult-page');
  if (target) target.classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  var tabBtn = document.querySelector('.tab-btn[data-tab="consult"]');
  if (tabBtn) tabBtn.classList.add('active');
  try { localStorage.setItem('openyou_last_tab', 'consult'); } catch(e) {}
  state.currentPage = 'consult';
  renderChatMessages();
  scrollChatBottom(state.isStreaming /* force during streaming */);
}

// Pass sub straight to the renderer — avoids a wrong-sub flash.
function switchTab(tab, sub) {
  try { localStorage.setItem('openyou_last_tab', tab); } catch(e) {}
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector('.tab-btn[data-tab="' + tab + '"]');
  if (btn) btn.classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const pageMap = {
    home: 'home-page',
    time: 'time-page',
    context: 'context-page',
    'consult': 'consult-page'
  };
  const pageId = pageMap[tab];
  if (pageId) {
    const page = document.getElementById(pageId);
    if (page) { page.classList.add('active'); state.currentPage = tab === 'context' ? 'context' : tab; }
  }
  if (tab === 'home') showPage('home');
  if (tab === 'time') showPage('time', sub);
  if (tab === 'context') showPage('context', sub);
  if (tab === 'consult') {
    if (!state.currentSessionId) {
      // Reuse the empty session so re-entering the tab doesn't pile up blank "New Consult" ones.
      const empty = state.sessions.find(x => x.messages.length === 0);
      const s = empty || createSession();
      state.currentSessionId = s.id;
      $('#chat-title').textContent = s.title;
    }
    showPage('consult', sub);
  }
}

function renderSessionList(filter) {
  const container = $('#session-list');
  const emptyEl = $('#sessions-empty');
  let sessions = state.sessions;
  if (filter) {
    const q = filter.toLowerCase();
    sessions = sessions.filter(s => {
      if (s.title.toLowerCase().includes(q)) return true;
      return s.messages.some(m => m.content && m.content.toLowerCase().includes(q));
    });
  }
  if (sessions.length === 0) {
    container.innerHTML = '';
    emptyEl.style.display = 'flex';
    return;
  }
  emptyEl.style.display = 'none';
  container.innerHTML = sessions.map(s => {
    // Preview prefers the last ASSISTANT reply — that's the "answer" the user wants to recognize.
    let answerMsg = null;
    for (let i = s.messages.length - 1; i >= 0; i--) {
      if (s.messages[i].role === 'assistant' && s.messages[i].content) { answerMsg = s.messages[i]; break; }
    }
    const lastMsg = s.messages.length > 0 ? s.messages[s.messages.length - 1] : null;
    const src = answerMsg || lastMsg;
    const preview = src && typeof src.content === 'string'
      ? src.content.replace(/\s*\n\s*/g, ' ').slice(0, 300) : '';
    return `
      <div class="session-item" data-id="${escHtml(s.id)}">
        <div class="session-content">
          <div class="session-title">${escHtml(s.title)}</div>
          ${preview ? `<div class="session-preview">${escHtml(preview)}</div>` : ''}
          <div class="session-meta">
            <span>${formatTime(s.updatedAt)}</span>
            <span>${s.messages.length} messages</span>
          </div>
        </div>
        <div class="swipe-bg"><span>Delete</span></div>
      </div>`;
  }).join('');
}

function escHtml(s) {
  // Escape quotes too: textContent alone doesn't, leaving attribute-injection XSS on server-derived data.
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function jsStr(s) {
  // escHtml's &#39; isn't a JS quote — only raw ' closes the literal, so backslash-escape it (XSS).
  return String(s === null || s === undefined ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\x00/g, '\\0');
}

// " ] in a querySelector attribute would throw; manual fallback for old WebViews.
function cssAttrEscape(v) {
  const s = String(v);
  if (window.CSS && CSS.escape) return CSS.escape(s);
  return s.replace(/["\\\]]/g, '\\$&');
}

function initSessionListTouch() {
  const list = $('#session-list');
  let startX = 0, startY = 0, item = null, swiping = false;

  list.addEventListener('touchstart', e => {
    item = e.target.closest('.session-item');
    if (!item) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    swiping = false;

    clearTimeout(state.pressTimer);
    state.longPressTarget = item;
    state.pressTimer = setTimeout(() => {
      const id = item.dataset.id;
      openRenameModal(id);
    }, 600);
  }, { passive: true });

  list.addEventListener('touchmove', e => {
    if (!item) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 5) {
      swiping = true;
      clearTimeout(state.pressTimer);
      if (dx < -30) {
        item.classList.add('swiped');
      } else if (dx > 10) {
        item.classList.remove('swiped');
      }
    } else if (Math.abs(dy) > 10) {
      clearTimeout(state.pressTimer);
    }
  }, { passive: true });

  list.addEventListener('touchend', e => {
    clearTimeout(state.pressTimer);
    if (!item) return;
    if (swiping && item.classList.contains('swiped')) {
      const touch = e.changedTouches[0];
      if (touch) {
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        if (el && el.closest('.swipe-bg')) {
          state._suppressClick = true;
          // Auto-clear: some WebViews skip the click after a big swipe, and a stuck flag would swallow the next tap.
          setTimeout(function() { state._suppressClick = false; }, 400);
          // FE-18: mark as swipe-deleted to prevent double-trigger
          item.dataset.swipeDeleted = '1';
          deleteSession(item.dataset.id);
          renderSessionList();
          showToast('Consult deleted');
          if (state.currentSessionId === item.dataset.id) {
            state.currentSessionId = null;
            showPage('consult');
          }
        }
      }
    } else if (!swiping) {
      const touch = e.changedTouches[0];
      if (touch && item.classList.contains('swiped')) {
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        if (el && el.closest('.swipe-bg')) {
          state._suppressClick = true;
          // Auto-clear: some WebViews skip the click after a big swipe, and a stuck flag would swallow the next tap.
          setTimeout(function() { state._suppressClick = false; }, 400);
          // FE-18: mark as swipe-deleted to prevent double-trigger
          item.dataset.swipeDeleted = '1';
          deleteSession(item.dataset.id);
          renderSessionList();
          showToast('Consult deleted');
          if (state.currentSessionId === item.dataset.id) {
            state.currentSessionId = null;
            showPage('consult');
          }
          item = null;
          return;
        }
      }
    }
    item = null;
  });
}

$('#session-list').addEventListener('click', e => {
  if (state._suppressClick) { state._suppressClick = false; return; }
  const item = e.target.closest('.session-item');
  if (!item) return;
  // FE-18: skip click if item was already deleted by swipe
  if (item.dataset.swipeDeleted) return;
  if (item.classList.contains('swiped')) {
    if (e.target.closest('.swipe-bg')) {
      deleteSession(item.dataset.id);
      renderSessionList();
      showToast('Consult deleted');
      if (state.currentSessionId === item.dataset.id) {
        state.currentSessionId = null;
        showPage('consult');
      }
    } else {
      item.classList.remove('swiped');
    }
    return;
  }
  openSession(item.dataset.id);
});

function openSession(id) {
  state.currentSessionId = id;
  // FE-3: persist last session
  try { localStorage.setItem('openyou_last_session', id); } catch(e) {}
  const s = getSession(id);
  if (s) {
    $('#chat-title').textContent = s.title;
  }
  // Force 'new' sub-tab — clicking a History entry must show chat, not the history view again.
  try { localStorage.setItem('openyou_last_csub', 'new'); } catch(e) {}
  switchTab('consult');
  ensureWebSocket();
  syncSessionFromServer(id);
}

// SQLite is the source of truth: re-hydrates a session even after localStorage is cleared.
function syncSessionFromServer(id) {
  fetch('/api/sessions/' + encodeURIComponent(id))
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (!data || !data.id) return;
      const serverMsgs = (data.messages || []).map(m => ({
        id: m.id || genId(),
        role: m.role,
        content: m.content,
        time: m.created_at ? Math.round(m.created_at / 1e6) : ts(),
      }));
      if (serverMsgs.length === 0) return;
      let sess = getSession(id);
      if (!sess) {
        sess = {
          id: data.id,
          title: data.title || 'Consult',
          messages: [],
          createdAt: data.created_at ? Math.round(data.created_at / 1e6) : ts(),
          updatedAt: data.updated_at ? Math.round(data.updated_at / 1e6) : ts(),
        };
        state.sessions.unshift(sess);
        saveSessions();
      }
      // Skip while streaming: re-render would replace the bubble mid-stream and drop in-flight text.
      if (state.isStreaming && id === state.streamingSessionId) return;
      if (serverMsgs.length > sess.messages.length) {
        sess.messages = serverMsgs;
        sess.title = data.title || sess.title;
        saveSessions();
        if (state.currentSessionId === id) {
          renderChatMessages();
          scrollChatBottom(state.isStreaming /* force during streaming */);
        }
      }
    })
    .catch(() => {}); // daemon offline — use local cache silently
}

function openRenameModal(id) {
  const s = getSession(id);
  if (!s) return;
  $('#rename-input').value = s.title;
  state._renameTargetId = id;
  openModal('modal-rename');
}

$('#session-search').addEventListener('input', function() {
  renderSessionList(this.value);
});

function renderChatMessages() {
  const s = getSession(state.currentSessionId);
  const container = $('#chat-messages');
  if (!s || s.messages.length === 0) {
    container.innerHTML = '';
    const oldNotice = $('#chat-compaction-notice');
    if (oldNotice) oldNotice.remove();
    return;
  }
  container.innerHTML = s.messages.map(m => renderMessageHTML(m)).join('');
  container.querySelectorAll('.msg.assistant .msg-bubble').forEach(bubble => setupMessageCollapse(bubble));
  const oldNotice = $('#chat-compaction-notice');
  if (oldNotice) oldNotice.remove();
  if (s.messages.length > 30) {
    const chatHeader = $('#consult-new').querySelector('.session-title-area');
    if (chatHeader) {
      const notice = document.createElement('div');
      notice.id = 'chat-compaction-notice';
      notice.style.cssText = 'padding:4px 12px;font-size:var(--fs-sm);background:var(--accent-bg);color:var(--accent);text-align:center';
      notice.textContent = 'Earlier conversation summarized.';
      chatHeader.after(notice);
    }
  }
}

function renderMessageHTML(m) {
  // Server-sourced ids land in attributes — a raw " would close the attribute early.
  let html = `<div class="msg ${m.role}" data-id="${escHtml(m.id)}" data-role="${m.role}">`;
  const contentHtml = m.role === 'assistant'
    ? renderCitations(formatContent(m.content))
    : formatContent(m.content);
  html += `<div class="msg-bubble">${contentHtml}`;

  if (m.tools && m.tools.length > 0) {
    m.tools.forEach(t => {
      html += `<div class="tool-card">
        <span class="tool-label">${escHtml(t.tool || t.name || 'tool')}</span>
        ${t.args ? `<div class="tool-args">${escHtml(typeof t.args === 'string' ? t.args : JSON.stringify(t.args))}</div>` : ''}
        ${t.output ? `<div class="tool-output">${escHtml(typeof t.output === 'string' ? t.output.slice(0, 500) : '')}</div>` : ''}
        ${t.error ? `<div class="tool-output" style="color:var(--danger)">Error: ${escHtml(t.error)}</div>` : ''}
      </div>`;
    });
  }

  if (m.citations && m.citations.length > 0) {
    html += `<div class="citations"><div class="citation-label">Sources:</div>`;
    var max = 3;
    m.citations.slice(0, max).forEach(c => {
      html += `<div class="citation-item cite-${escHtml(c.from || 'person')}" title="${escHtml(c.url || c.source || '')}" role="button" tabindex="0">${escHtml(c.title || c.source || c.url || '')}</div>`;
    });
    if (m.citations.length > max) {
      html += `<div class="citation-item" style="color:var(--text-hint);font-style:italic" role="button" tabindex="0">... +${m.citations.length - max} more</div>`;
    }
    html += `</div>`;
  }

  html += `</div>`;
  // onclick needs jsStr inside escHtml — either alone leaves an injection path.
  if (m.role === 'assistant' && m.content) {
    const sidAttr = escHtml(jsStr(state.currentSessionId));
    const midAttr = escHtml(jsStr(m.id));
    html += `<div class="feedback-btns" data-msg-id="${escHtml(m.id)}" data-session="${escHtml(state.currentSessionId)}">`;
    html += `<button class="fb-btn" data-msg-id="${escHtml(m.id)}" onclick="sendFeedback('${sidAttr}','${midAttr}','useful')" title="Useful">👍</button>`;
    html += `<button class="fb-btn" data-msg-id="${escHtml(m.id)}" onclick="sendFeedback('${sidAttr}','${midAttr}','inaccurate')" title="Inaccurate — add correction">👎</button>`;
    html += `</div>`;
  }
  html += `<div class="msg-time">${formatTime(m.time)}${m.interrupted ? ' (interrupted)' : ''}</div>`;
  html += `</div>`;
  return html;
}

function renderCitations(html) {
  return html
    .replace(/\[👤([^\]]+)\]/g, '<span class="cite-chip cite-person">👤$1</span>')
    .replace(/\[📋([^\]]+)\]/g, '<span class="cite-chip cite-rule">📋$1</span>')
    .replace(/\[🧠([^\]]+)\]/g, '<span class="cite-chip cite-skill">🧠$1</span>')
    .replace(/\[🌐([^\]]+)\]/g, '<span class="cite-chip cite-external">🌐$1</span>');
}

function formatContent(text) {
  if (!text) return '';
  let s = escHtml(text);
  // Inline code first: **/* inside a code span must not be parsed as bold/italic; restore after.
  const codeSpans = [];
  s = s.replace(/`([^`]+)`/g, (_, code) => {
    const i = codeSpans.length;
    codeSpans.push(code);
    return '\u0000CODE' + i + '\u0000';
  });
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  s = s.replace(/\n/g, '<br>');
  // Restore placeholders (content already escaped by escHtml above).
  s = s.replace(/\u0000CODE(\d+)\u0000/g, (_, i) =>
    '<code style="font-family:var(--font-mono);font-size:var(--fs-md);background:var(--bg-input);padding:1px 5px;border-radius:var(--radius-xs);">' + codeSpans[+i] + '</code>');
  return s;
}

// Security: escape text first, then wrap fixed markup only — document content
// can't inject HTML; links stay non-live because documents are user-editable data.
function renderMarkdownDoc(text) {
  if (!text) return '';
  var s = String(text);
  // Drop YAML frontmatter (skill docs start with ---/name/triggers/---); it's metadata, not reading content.
  s = s.replace(/^---[ \t]*\r?\n[\s\S]*?\r?\n---[ \t]*\r?\n?/, '');
  s = escHtml(s);

  // Fenced code blocks → placeholders so no other rule touches them.
  var codeBlocks = [];
  s = s.replace(/```[^\n]*\n([\s\S]*?)```/g, function(_, code) {
    codeBlocks.push(code.replace(/\n$/, ''));
    return '\u0001CB' + (codeBlocks.length - 1) + '\u0001';
  });
  var inlineCodes = [];
  s = s.replace(/`([^`\n]+)`/g, function(_, c) {
    inlineCodes.push(c);
    return '\u0001IC' + (inlineCodes.length - 1) + '\u0001';
  });

  function inline(t) {
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<span class="md-link">$1</span>');
    return t;
  }

  var lines = s.split('\n');
  var html = '';
  var i = 0;
  var isBlockStart = function(l) {
    var t = l.trim();
    return t === '' ||
      /^\u0001CB\d+\u0001$/.test(t) ||
      /^#{1,6}\s+/.test(t) ||
      /^(-{3,}|\*{3,}|_{3,})$/.test(t) ||
      /^\|.*\|\s*$/.test(t) ||
      /^&gt;/.test(t) ||
      /^\s*[-*+]\s+/.test(l) ||
      /^\s*\d+[.)]\s+/.test(l);
  };

  while (i < lines.length) {
    var line = lines[i];
    var trimmed = line.trim();
    if (trimmed === '') { i++; continue; }

    var cb = trimmed.match(/^\u0001CB(\d+)\u0001$/);
    if (cb) {
      html += '<pre class="md-pre"><code>' + codeBlocks[+cb[1]] + '</code></pre>';
      i++; continue;
    }

    var h = trimmed.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      var lvl = Math.min(h[1].length, 4);
      html += '<h' + lvl + ' class="md-h">' + inline(h[2]) + '</h' + lvl + '>';
      i++; continue;
    }

    if (/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)) { html += '<hr class="md-hr">'; i++; continue; }

    if (/^\|.*\|\s*$/.test(trimmed) && i + 1 < lines.length &&
        /^\|[\s:|-]+\|\s*$/.test(lines[i + 1].trim())) {
      var parseRow = function(r) {
        return r.replace(/^\||\|$/g, '').split('|').map(function(c) { return inline(c.trim()); });
      };
      var head = parseRow(trimmed);
      i += 2;
      var rows = [];
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i].trim())) {
        rows.push(parseRow(lines[i].trim()));
        i++;
      }
      html += '<div class="md-table-wrap"><table class="md-table"><thead><tr>' +
        head.map(function(c) { return '<th>' + c + '</th>'; }).join('') +
        '</tr></thead><tbody>' +
        rows.map(function(r) {
          return '<tr>' + r.map(function(c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
        }).join('') +
        '</tbody></table></div>';
      continue;
    }

    // '>' is '&gt;' after escaping.
    if (/^&gt;/.test(trimmed)) {
      var quote = [];
      while (i < lines.length && /^&gt;/.test(lines[i].trim())) {
        quote.push(inline(lines[i].trim().replace(/^&gt;\s?/, '')));
        i++;
      }
      html += '<blockquote class="md-quote">' + quote.join('<br>') + '</blockquote>';
      continue;
    }

    if (/^\s*[-*+]\s+/.test(line)) {
      var items = [];
      while (i < lines.length) {
        var m = lines[i].match(/^(\s*)[-*+]\s+(.*)$/);
        if (!m) break;
        var itemText = m[2].replace(/^\[[ xX]\]\s*/, function(box) {
          return box.toLowerCase().indexOf('x') >= 0 ? '☑ ' : '☐ ';
        });
        var indent = m[1].replace(/\t/g, '  ').length;
        if (indent >= 2 && items.length > 0) {
          var last = items[items.length - 1];
          last.sub = last.sub || [];
          last.sub.push(inline(itemText));
        } else {
          items.push({ text: inline(itemText) });
        }
        i++;
      }
      html += '<ul class="md-ul">' + items.map(function(it) {
        var sub = (it.sub && it.sub.length)
          ? '<ul>' + it.sub.map(function(x) { return '<li>' + x + '</li>'; }).join('') + '</ul>'
          : '';
        return '<li>' + it.text + sub + '</li>';
      }).join('') + '</ul>';
      continue;
    }

    if (/^\s*\d+[.)]\s+/.test(line)) {
      var oitems = [];
      while (i < lines.length) {
        var om = lines[i].match(/^\s*\d+[.)]\s+(.*)$/);
        if (!om) break;
        oitems.push(inline(om[1]));
        i++;
      }
      html += '<ol class="md-ol">' + oitems.map(function(x) { return '<li>' + x + '</li>'; }).join('') + '</ol>';
      continue;
    }

    var para = [inline(trimmed)];
    i++;
    while (i < lines.length && !isBlockStart(lines[i])) {
      para.push(inline(lines[i].trim()));
      i++;
    }
    html += '<p class="md-p">' + para.join('<br>') + '</p>';
  }

  html = html.replace(/\u0001CB(\d+)\u0001/g, function(_, n) {
    return '<pre class="md-pre"><code>' + codeBlocks[+n] + '</code></pre>';
  });
  html = html.replace(/\u0001IC(\d+)\u0001/g, function(_, n) {
    return '<code class="md-code">' + inlineCodes[+n] + '</code>';
  });
  return html;
}

// Read-first: saveBtn shows only in edit mode (nothing to save while reading).
function wireMarkdownPreview(btnId, taId, previewId, startInPreview, saveBtnId) {
  const btn = $('#' + btnId);
  if (!btn) return;
  const ta = $('#' + taId);
  const pv = $('#' + previewId);
  if (!ta || !pv) return;
  const saveBtn = saveBtnId ? $('#' + saveBtnId) : null;
  const showPreview = function() {
    pv.innerHTML = renderMarkdownDoc(ta.value);
    pv.style.display = '';
    ta.style.display = 'none';
    btn.textContent = 'Edit';
    if (saveBtn) saveBtn.style.display = 'none';
  };
  const showEditor = function() {
    pv.style.display = 'none';
    ta.style.display = '';
    btn.textContent = 'Preview';
    if (saveBtn) saveBtn.style.display = '';
  };
  btn.addEventListener('click', function() {
    if (pv.style.display !== 'none') showEditor(); else showPreview();
  });
  if (startInPreview) showPreview();
}

function setupEditorPreview(taId, previewId) {
  const btn = $('#btn-editor-preview');
  if (!btn) return;
  btn.textContent = 'Preview';
  btn.onclick = function() {
    const ta = $('#' + taId);
    const pv = $('#' + previewId);
    if (!ta || !pv) return;
    if (pv.style.display !== 'none') {
      pv.style.display = 'none';
      ta.style.display = '';
      btn.textContent = 'Preview';
    } else {
      pv.innerHTML = renderMarkdownDoc(ta.value);
      pv.style.display = '';
      ta.style.display = 'none';
      btn.textContent = 'Edit';
    }
  };
}

function appendMsgToDOM(m) {
  const container = $('#chat-messages');
  const div = document.createElement('div');
  div.innerHTML = renderMessageHTML(m);
  while (div.firstChild) container.appendChild(div.firstChild);
  if (m.role === 'assistant') {
    const msgs = container.querySelectorAll('.msg.assistant');
    if (msgs.length > 0) {
      const lastBubble = msgs[msgs.length - 1].querySelector('.msg-bubble');
      if (lastBubble) setupMessageCollapse(lastBubble);
    }
  }
  scrollChatBottom(state.isStreaming /* force during streaming */);
}

function setupMessageCollapse(bubble) {
  requestAnimationFrame(function() {
    if (bubble.scrollHeight > 600) {
      bubble.classList.add('overflowing');
      bubble.addEventListener('click', function() {
        this.classList.toggle('expanded');
        this.classList.remove('overflowing');
      }, {once: true});
    }
  });
}

function appendTextDelta(text) {
  const s = getSession(state.currentSessionId);
  if (!s) return;
  const bubbles = $$('.msg.assistant .msg-bubble', $('#chat-messages'));
  if (bubbles.length === 0) return;
  const lastBubble = bubbles[bubbles.length - 1];
  state.currentStreamingText = (state.currentStreamingText || '') + text;
  // Rebuild innerHTML only every 50 chars or on newlines — reduces layout thrashing.
  if (state.currentStreamingText.length % 50 === 0 || text.includes('\n')) {
    lastBubble.innerHTML = formatContent(state.currentStreamingText);
  } else {
    const textNode = document.createTextNode(text);
    lastBubble.appendChild(textNode);
  }
  const lastAssistant = s.messages[s.messages.length - 1];
  if (lastAssistant && lastAssistant.tools && lastAssistant.tools.length > 0) {
    lastAssistant.tools.forEach(t => {
      const card = document.createElement('div');
      card.className = 'tool-card';
      card.innerHTML = `<span class="tool-label">${escHtml(t.tool || t.name || 'tool')}</span>`;
      if (t.args) {
        const argsDiv = document.createElement('div');
        argsDiv.className = 'tool-args';
        argsDiv.textContent = typeof t.args === 'string' ? t.args : JSON.stringify(t.args);
        card.appendChild(argsDiv);
      }
      if (t.output) {
        const outputDiv = document.createElement('div');
        outputDiv.className = 'tool-output';
        outputDiv.textContent = (typeof t.output === 'string' ? t.output : '').slice(0, 500);
        card.appendChild(outputDiv);
      }
      lastBubble.appendChild(card);
    });
  }
  scrollChatBottom(state.isStreaming /* force during streaming */);
}

function showThinking(show) {
  $('#thinking-indicator').style.display = show ? 'flex' : 'none';
}

function setStreaming(isStreaming) {
  state.isStreaming = isStreaming;
  const input = $('#chat-input');
  const btn = $('#btn-send');
  btn.disabled = isStreaming;
  input.disabled = isStreaming;
  if (!isStreaming) {
    input.focus();
    $('#thinking-indicator').style.display = 'none';
    const bubbles = $$('.msg.assistant', $('#chat-messages'));
    bubbles.forEach(b => b.classList.remove('streaming'));
  } else {
    const bubbles = $$('.msg.assistant', $('#chat-messages'));
    if (bubbles.length > 0) bubbles[bubbles.length - 1].classList.add('streaming');
  }
}

function scrollChatBottom(force) {
  const container = $('#chat-messages');
  const threshold = 150;
  const atBottom = container.scrollHeight - container.scrollTop - container.clientHeight < threshold;
  if (atBottom || force) {
    container.scrollTop = container.scrollHeight;
  }
}

function sendMessage() {
  const input = $('#chat-input');
  const text = input.value.trim();
  if (!text || state.isStreaming) return;
  recordUsage('consult');
  if (!state.isConnected) {
    // Bind to the session it was typed in — a late flush after switching sessions must not hit the wrong one.
    state.pendingSendQueue.push({ text: text, sid: state.currentSessionId });
    showToast('Queued. Will send when connected.', 'warn');
    input.value = '';
    return;
  }
  if (!state.currentSessionId) {
    const s = createSession();
    state.currentSessionId = s.id;
  }

  const msg = addMessage(state.currentSessionId, 'user', text);
  appendMsgToDOM(msg);
  input.value = '';
  input.style.height = 'auto';

  state.lastUserMessage = text;
  // Bind the stream to its session so deltas/done never write elsewhere if the user switches mid-stream.
  state.streamingSessionId = state.currentSessionId;
  sendWS({ type: 'chat', session_id: state.currentSessionId, message: text });

  const assistantMsg = addMessage(state.currentSessionId, 'assistant', '', {
    tools: [],
    citations: []
  });
  appendMsgToDOM(assistantMsg);
  setStreaming(true);
  showThinking(true);
  scrollChatBottom(true);

  renderSessionList();
}

function flushSendQueue() {
  if (state.pendingSendQueue.length > 10) {
    state.pendingSendQueue = state.pendingSendQueue.slice(-10);
  }
  if (state.pendingSendQueue.length > 0 && state.isConnected && !state.isStreaming) {
    const input = $('#chat-input');
    const draft = input ? input.value : '';
    const entry = state.pendingSendQueue.shift();
    // Tolerate legacy plain-string entries from older queue states.
    const text = typeof entry === 'string' ? entry : entry.text;
    const sid = typeof entry === 'string' ? null : entry.sid;
    if (sid && getSession(sid)) state.currentSessionId = sid;
    if (input) input.value = text;
    sendMessage();
    if (input && draft) input.value = draft;
  }
}

function initChatTouch() {
  const container = $('#chat-messages');
  container.addEventListener('touchstart', e => {
    const msgEl = e.target.closest('.msg');
    if (!msgEl) return;
    clearTimeout(state.pressTimer);
    state.longPressTarget = msgEl;
    state.pressTimer = setTimeout(() => {
      showContextMenu(e, msgEl);
    }, 600);
  }, { passive: true });

  container.addEventListener('touchmove', () => {
    clearTimeout(state.pressTimer);
  });

  container.addEventListener('touchend', () => {
    clearTimeout(state.pressTimer);
  });

  container.addEventListener('scroll', () => {});
}

function showContextMenu(e, msgEl) {
  const menu = $('#context-menu');
  const backdrop = $('#context-menu-backdrop');
  menu.style.top = (e.touches ? e.touches[0].clientY : e.clientY) + 'px';
  menu.style.left = (e.touches ? e.touches[0].clientX : e.clientX) + 'px';
  menu.classList.add('show');
  menu._target = msgEl;
  if (backdrop) backdrop.style.display = 'block';

  requestAnimationFrame(() => {
    const rect = menu.getBoundingClientRect();
    const safeBottom = 34; // FE-12: iPhone home indicator safe area
    if (rect.bottom > window.innerHeight - safeBottom) menu.style.top = (window.innerHeight - rect.height - safeBottom - 10) + 'px';
    if (rect.right > window.innerWidth) menu.style.left = (window.innerWidth - rect.width - 10) + 'px';
    if (rect.left < 0) menu.style.left = '10px';
  });
}

function closeContextMenu() {
  $('#context-menu').classList.remove('show');
  const backdrop = $('#context-menu-backdrop');
  if (backdrop) backdrop.style.display = 'none';
}

$('#context-menu').addEventListener('click', function(e) {
  const action = e.target.closest('.menu-item') && e.target.closest('.menu-item').dataset.action;
  const msgEl = this._target;
  if (!action || !msgEl) return;
  const msgId = msgEl.dataset.id;
  handleMessageAction(action, msgId, msgEl);
  closeContextMenu();
});

document.addEventListener('DOMContentLoaded', function() {
  const backdrop = document.getElementById('context-menu-backdrop');
  if (backdrop) {
    backdrop.addEventListener('click', closeContextMenu);
    backdrop.addEventListener('touchstart', closeContextMenu, { passive: true });
  }
});

function handleMessageAction(action, msgId, msgEl) {
  const s = getSession(state.currentSessionId);
  if (!s) return;
  const idx = s.messages.findIndex(m => m.id === msgId);
  if (idx < 0) return;

  switch (action) {
    case 'copy':
      navigator.clipboard.writeText(s.messages[idx].content || '').then(() => {
        showToast('Copied');
      }).catch(() => {});
      break;
    case 'delete':
      s.messages.splice(idx, 1);
      saveSessions();
      renderChatMessages();
      scrollChatBottom(true);
      break;
    case 'regenerate':
      // Don't regenerate while streaming/offline — two streams would interleave into one bubble.
      if (state.isStreaming) { showToast('Reply in progress, please wait', 'warn'); break; }
      if (!state.isConnected) { showToast('Not connected, cannot regenerate', 'warn'); break; }
      let userMsg = null;
      for (let i = idx - 1; i >= 0; i--) {
        if (s.messages[i].role === 'user') { userMsg = s.messages[i]; break; }
      }
      if (userMsg) {
        s.messages.splice(idx, s.messages.length - idx);
        saveSessions();
        renderChatMessages();
        state.lastUserMessage = userMsg.content;
        state.streamingSessionId = state.currentSessionId;
        sendWS({ type: 'chat', session_id: state.currentSessionId, message: userMsg.content });
        const assistantMsg = addMessage(state.currentSessionId, 'assistant', '', { tools: [], citations: [] });
        appendMsgToDOM(assistantMsg);
        setStreaming(true);
        showThinking(true);
        scrollChatBottom(true);
      }
      break;
    case 'edit':
      const content = s.messages[idx].content;
      $('#chat-input').value = content;
      s.messages.splice(idx, 1);
      saveSessions();
      renderChatMessages();
      $('#chat-input').focus();
      break;
  }
}

function renderSettings() {
  const container = $('#settings-scroll');
  let html = '';
  SETTINGS_SCHEMA.forEach(section => {
    html += `<div class="settings-section" data-section="${section.id}">
      <div class="settings-section-header">
        <span class="section-title">${section.title}</span>
      </div>
      <div class="settings-section-body"><div class="settings-section-inner">`;

    section.rows.forEach(row => {
      const val = state.settings[row.key] ?? '';
      html += `<div class="setting-row" data-key="${row.key}">
        <label>${row.label}</label>`;

      switch (row.type) {
        case 'text':
          html += `<input type="text" value="${escHtml(String(val))}" placeholder="${row.placeholder || ''}">`;
          break;
        case 'password':
          // daemon key stays editable so the user can override it; blank keeps the existing key (empty is never sent).
          const ph = row.key === 'apiKey' && state.daemonHasKey
            ? '已配置 — 留空保持不变'
            : (row.placeholder || '');
          html += `<div style="display:flex;align-items:center;gap:4px">` +
            `<input type="password" value="${escHtml(String(val))}" placeholder="${ph}" style="flex:1">` +
            `<button type="button" class="btn-small pw-toggle" style="padding:2px 6px;font-size:var(--fs-sm)" data-visible="0">👁</button>` +
            `</div>`;
          break;
        case 'number':
          // escHtml: restored-backup values with an unescaped quote break out of the attribute (stored XSS).
          html += `<input type="number" value="${escHtml(String(val))}" min="${row.min || 0}" max="${row.max || 999999}">`;
          break;
        case 'range':
          html += `<input type="range" value="${escHtml(String(val))}" min="${row.min || 0}" max="${row.max || 2}" step="${row.step || 0.1}">
            <span style="margin-left:8px;font-size:var(--fs-md);color:var(--text-dim);min-width:32px;text-align:right">${escHtml(String(val))}</span>`;
          break;
        case 'select':
          const opts = row.options || [];
          if (opts.length === 2 && !row.forceSelect) {
            html += `<div class="segmented-control" data-key="${row.key}">`;
            opts.forEach(o => {
              html += `<button class="seg-option${val == o.value ? ' active' : ''}" data-value="${o.value}">${o.label}</button>`;
            });
            html += `</div>`;
          } else {
            html += `<select>${opts.map(o => `<option value="${o.value}" ${val == o.value ? 'selected' : ''}>${o.label}</option>`).join('')}</select>`;
          }
          break;
        case 'checkbox':
          html += `<input type="checkbox" ${val ? 'checked' : ''}>`;
          break;
        case 'info':
          let infoVal = row.value || '';
          if (row.key === 'backupTime') infoVal = state.settings.backupTime ? formatTime(state.settings.backupTime) : 'Never';
          html += `<span class="setting-disabled">${infoVal}</span>`;
          break;

          break;

      if (row.hint) html += `<div class="settings-hint">${row.hint}</div>`;
      html += `</div>`;
    });

    html += `</div></div></div>`;
  });

  container.innerHTML = html;
  bindSettingsEvents(container);
}

function bindSettingsEvents(container) {
  container.querySelectorAll('.settings-section-header').forEach(header => {
    header.addEventListener('click', () => {
      header.parentElement.classList.toggle('open');
      saveSettingsOpenState();
    });
  });

  loadSettingsOpenState(container);

  container.querySelectorAll('.setting-row input[type="text"], .setting-row input[type="number"], .setting-row input[type="password"]').forEach(input => {
    input.addEventListener('change', () => {
      const key = input.closest('.setting-row').dataset.key;
      if (key && key.indexOf('--placeholder') < 0) {
        state.settings[key] = input.type === 'number' ? (isNaN(Number(input.value)) ? 0 : Number(input.value)) : input.value;
        saveSettings();
      }
    });
  });

  container.querySelectorAll('.setting-row select').forEach(select => {
    select.addEventListener('change', () => {
      const key = select.closest('.setting-row').dataset.key;
      if (key) {
        state.settings[key] = select.options[select.selectedIndex].value;
        saveSettings();
      }
    });
  });

  container.querySelectorAll('.setting-row input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const key = cb.closest('.setting-row').dataset.key;
      if (key) {
        state.settings[key] = cb.checked;
        saveSettings();
      }
    });
  });

  container.querySelectorAll('.setting-row input[type="range"]').forEach(range => {
    const debouncedSave = debounce(() => {
      const key = range.closest('.setting-row').dataset.key;
      if (key) {
        state.settings[key] = parseFloat(range.value);
        saveSettings();
      }
    }, 500);
    range.addEventListener('input', () => {
      const row = range.closest('.setting-row');
      const valSpan = row.querySelector('span');
      if (valSpan) valSpan.textContent = range.value;
      debouncedSave();
    });
  });

  container.querySelectorAll('.pw-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const inp = btn.previousElementSibling;
      if (!inp) return;
      const showing = btn.dataset.visible === '1';
      inp.type = showing ? 'password' : 'text';
      btn.dataset.visible = showing ? '0' : '1';
      btn.textContent = showing ? '👁' : '🙈';
    });
  });

  container.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      if (action === 'backup') {
        // daemon can't see WebView localStorage, so settings ride along; api_key deliberately excluded.
        let starHistory = [];
        try { starHistory = JSON.parse(localStorage.getItem('oy_star_history_v1') || '[]'); } catch (e) {}
        const settings = { ...state.settings };
        delete settings.apiKey;
        const extras = JSON.stringify({ star_history: starHistory, settings: settings });
        const fname = 'openyou-backup-' + _localStamp() + '.zip';
        const bridge = window.openCodeBridge;
        if (bridge && bridge.exportBackup) {
          // Kotlin streams to MediaStore, avoiding whole-package base64 (large backups would OOM).
          showToast('Exporting…');
          let res = null;
          try { res = JSON.parse(bridge.exportBackup(fname, extras)); } catch (e) {}
          if (!res || res.ok !== true) {
            showToast('Export failed' + (res && res.error ? ': ' + res.error : ''), 'error');
            return;
          }
          const warns = parseInt(res.warnings || '0', 10);
          showToast(warns > 0 ? 'Saved (INCOMPLETE: ' + warns + ' item(s) failed)' : 'Saved to Download/H/' + res.name, warns > 0 ? 'warn' : '');
          state.settings.backupTime = ts();
          saveSettings();
          updateSettingsDisplay('backupTime', formatTime(state.settings.backupTime));
          return;
        }
        // desktop fallback without the bridge: fetch the zip to trigger a download.
        fetch('/api/backup/export', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: extras
        })
          .then(r => {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            // a partially-failed backup still ships but is flagged, so users don't mistake it for a complete one.
            const warns = parseInt(r.headers.get('X-Backup-Warnings') || '0', 10);
            // must await arrayBuffer() first, else Uint8Array(Promise) yields a 0-length empty zip.
            return r.arrayBuffer().then(buf => ({ buf: buf, warns: warns }));
          })
          .then(({ buf, warns }) => {
            const blob = new Blob([buf], { type: 'application/zip' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fname;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showToast(warns > 0 ? 'Backup exported (INCOMPLETE: ' + warns + ' item(s) failed)' : 'Backup exported', warns > 0 ? 'warn' : '');
            state.settings.backupTime = ts();
            saveSettings();
            updateSettingsDisplay('backupTime', formatTime(state.settings.backupTime));
          })
          .catch(e => showToast('Export failed: ' + e.message, 'error'));
      } else if (action === 'restore') {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.zip,application/zip';
        input.style.display = 'none';
        // ArkWeb needs the input attached to open the picker; replace the stale one a cancel left.
        const prev = document.getElementById('restore-file-input');
        if (prev) prev.remove();
        input.id = 'restore-file-input';
        document.body.appendChild(input);
        input.onchange = async () => {
          const file = input.files[0];
          input.remove();
          if (!file) return;
          // only accept our own export filenames; reject the rest before they reach the daemon.
          if (!/^openyou-backup-\d{8}-\d{6}\.zip$/i.test(file.name)) {
            showToast('Invalid name — expected openyou-backup-yyyymmdd-hhmmss.zip', 'error');
            return;
          }
          // import is add-only — fills gaps, never deletes; still worth confirming.
          if (!confirm('Import adds missing data from this backup. Existing data is kept (nothing is deleted or overwritten). Continue?')) return;

          const bridge = window.openCodeBridge;
          if (bridge && bridge.beginImport) {
            // chunked stream upload avoids a whole-package base64 OOM in JS/JNI.
            showToast('Importing…');
            try {
              if (!bridge.beginImport()) throw new Error('cannot start import');
              const CHUNK = 3 * 1024 * 1024;
              for (let off = 0; off < file.size; off += CHUNK) {
                const buf = await file.slice(off, Math.min(off + CHUNK, file.size)).arrayBuffer();
                if (!bridge.appendImportChunk(_bufToBase64(buf))) throw new Error('write failed');
              }
              const respText = bridge.finishImport();
              let d = null;
              try { d = JSON.parse(respText); } catch (e) {}
              if (!d) throw new Error('bad daemon response');
              handleImportResult(d);
            } catch (e) {
              showToast('Import failed: ' + e.message, 'error');
            }
            return;
          }

          // desktop fallback: whole-package base64 envelope upload.
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const body = JSON.stringify({ format: 'zip', name: file.name, data: _bufToBase64(reader.result) });
              fetch('/api/backup/import', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: body
              }).then(r => r.json())
                .then(handleImportResult)
                .catch(e => showToast('Import failed: ' + e.message, 'error'));
            } catch (e) {
              showToast('Invalid backup file', 'error');
            }
          };
          reader.readAsArrayBuffer(file);
        };
        input.click();
      } else if (action === 'test-connection') {
        testConnection();
      }
    });
  });
}

// Whitelist restored keys against defaultSettings() — a crafted manifest can't inject __proto__ etc.
function handleImportResult(d) {
  // ok can be the string "false" (truthy) — compare explicitly, else a 207 partial failure reads as success.
  const okFlag = d.ok === 'true' || d.ok === true;
  if (!okFlag && d.error) {
    showToast('Restore failed: ' + d.error, 'warn');
    return;
  }
  if (Array.isArray(d.star_history)) {
    try { localStorage.setItem('oy_star_history_v1', JSON.stringify(d.star_history)); } catch (e) {}
  }
  if (d.settings && typeof d.settings === 'object') {
    const known = defaultSettings();
    Object.keys(d.settings).forEach(k => {
      if (k === 'apiKey' || k === 'backupTime') return;
      if (!Object.prototype.hasOwnProperty.call(known, k)) return;
      state.settings[k] = d.settings[k];
    });
    saveSettings();
  }
  state.settings.backupTime = ts();
  saveSettings();
  updateSettingsDisplay('backupTime', formatTime(state.settings.backupTime));
  if (!okFlag) {
    showToast('Restore partial: ' + ((d.failures || []).length) + ' item(s) failed', 'warn');
  } else {
    const parts = [];
    if (d.files_restored) parts.push(d.files_restored + ' files');
    if (d.sessions_restored) parts.push(d.sessions_restored + ' sessions');
    if (d.memories_restored) parts.push(d.memories_restored + ' memories');
    if (d.tasks_restored) parts.push(d.tasks_restored + ' tasks');
    if (d.feedback_restored) parts.push(d.feedback_restored + ' feedback');
    showToast(parts.length ? 'Restored ' + parts.join(', ') : 'Backup imported (already up to date)');
  }
  loadHome();
  loadContextMemories && loadContextMemories();
  renderSessionList && renderSessionList();
  loadTasks && loadTasks();
  loadContextInsides && loadContextInsides();
  loadContextRules && loadContextRules();
  loadContextSkills && loadContextSkills();
}

// name by local time; toISOString() is UTC and would backdate a UTC+8 morning backup by a day.
function _localStamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' +
    pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
}

// chunked to avoid apply() exceeding the call-stack argument limit.
function _bufToBase64(buf) {
  const bytes = new Uint8Array(buf);
  let binary = '';
  for (let i = 0; i < bytes.length; i += 0x8000) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(binary);
}

// Rendering the target sub directly (instead of loading inside first) avoids
// the visible inside→target flash when arriving from the Home dashboard.
function renderContextPage(sub) {
  bindContextSubtabs();
  var target = sub;
  if (!target) {
    try { target = localStorage.getItem('openyou_last_ksub') || ''; } catch(e) {}
  }
  if (target !== 'inside' && target !== 'rule' && target !== 'skill') target = 'inside';
  var bar = $('#contextsubtabs');
  if (bar) {
    bar.querySelectorAll('.contextsubtab').forEach(function(t) {
      t.classList.toggle('active', t.dataset.ksub === target);
    });
  }
  try { localStorage.setItem('openyou_last_ksub', target); } catch(e) {}
  if (target === 'inside') loadContextInsides();
  else if (target === 'rule') loadContextRules();
  else loadContextSkills();
}

function bindContextSubtabs() {
  const bar = $('#contextsubtabs');
  if (!bar) return;
  if (!bar._bound) {
    bar._bound = true;
    bar.addEventListener('click', function(e) {
      const tab = e.target.closest('.contextsubtab');
      if (!tab) return;
      bar.querySelectorAll('.contextsubtab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const sub = tab.dataset.ksub;
      try { localStorage.setItem('openyou_last_ksub', sub); } catch(e) {}
      if (sub === 'inside') loadContextInsides();
      if (sub === 'rule') loadContextRules();
      if (sub === 'skill') loadContextSkills();
    });
  }
}

function loadContextInsides() {
  var container = $('#context-content');
  container.innerHTML = '<div class="empty-state">···</div>';
  fetch('/api/docs')
    .then(function(r) { return r.json(); })
    .then(function(files) {
      var insides = files.filter(function(f) { return f.path.indexOf('inside/') === 0; });
      renderDocList(container, insides, 'inside');
    })
    .catch(function() { container.innerHTML = '<div class="empty-state">Failed to load.</div>'; });
}

function renderDocList(container, files, prefix) {
  if (!files) files = [];
  var html = '<div style="display:flex;gap:6px;margin-bottom:8px">' +
    '<input id="doc-add-input" placeholder="add... (dir/name.md)" autocomplete="off" style="flex:1;min-width:0;padding:6px 8px;background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:var(--fs-md)">' +
    '<button id="btn-starc-add" class="add-btn">+</button>' +
    '</div>';
  if (files.length === 0) {
    html += '<div class="empty-state">No documents yet.</div>';
  } else {
    files.forEach(function(f) {
    html += '<div class="people-card doc-card" data-path="' + escHtml(f.path) + '" style="position:relative;overflow:hidden">' +
      '<div class="swipe-bg"><span>Delete</span></div>' +
      '<div class="doc-path">' + escHtml(f.path) + '</div>' +
      (f.preview ? '<div class="doc-preview">' + escHtml(f.preview) + '</div>' : '') +
    '</div>';
    });
  }
  container.innerHTML = html;
  if (files.length > 0) wireDocSwipe(container);
  var addBtn = $('#btn-starc-add');
  var addInp = $('#doc-add-input');
  function docAdd() {
    var val = (addInp.value || '').trim();
    if (!val) return;
    if (!val.endsWith('.md')) val += '.md';
    var path = (prefix || 'inside') + '/' + val.replace(/^\//, '');
    fetch('/api/docs/' + encodeURIComponent(path), {
      method: 'PUT', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({content: ''})
    }).then(function(r) { return r.json(); })
      .then(function() { addInp.value = ''; reloadDocTab(path); })
      .catch(function() { showToast('Failed to create', 'warn'); });
  }
  if (addBtn) addBtn.addEventListener('click', docAdd);
  if (addInp) addInp.addEventListener('keydown', function(e) { if (e.key === 'Enter') docAdd(); });
}

function wireDocSwipe(container) {
  container.querySelectorAll('.doc-card').forEach(function(el) {
    var sx = 0, sy = 0, sw = false;
    el.addEventListener('touchstart', function(e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; sw = false; }, {passive:true});
    el.addEventListener('touchmove', function(e) {
      var dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 5) {
        sw = true; if (dx < -30) el.classList.add('swiped'); else if (dx > 10) el.classList.remove('swiped');
      }
    }, {passive:true});
    el.addEventListener('touchend', function() {
      if (el.classList.contains('swiped')) { clearTimeout(el._st); el._st = setTimeout(function() { el.classList.remove('swiped'); }, 1200); }
    });
    el.addEventListener('click', function(e) {
      if (el.classList.contains('swiped')) {
        if (e.target.closest('.swipe-bg')) { e.stopPropagation(); deleteDoc(el.dataset.path); }
        el.classList.remove('swiped'); clearTimeout(el._st); return;
      }
      openDocEdit(el.dataset.path);
    });
  });
}

function reloadDocTab(path) {
  if (path.indexOf('inside/') === 0) loadContextInsides();
  else if (path.indexOf('rule/') === 0) loadContextRules();
  else if (path.indexOf('skill/') === 0) loadContextSkills();
  else loadContextInsides();
}

function openDocEdit(path) {
  fetch('/api/docs/' + encodeURIComponent(path))
    .then(function(r) { if (!r.ok) throw r.status; return r.text(); })
    .then(function(content) {
      var container = $('#context-content');
      container.innerHTML =
        '<div style="display:flex;flex-direction:column;height:100%">' +
        // Filename on its own line so long paths are never truncated by the buttons.
        '<div style="padding:6px 0 4px;font-size:var(--fs-md);font-weight:500;color:var(--accent-text);word-break:break-all">' + escHtml(path) + '</div>' +
        // Reading mode → no Save; there is nothing to save until edit mode.
        '<div style="display:flex;align-items:center;gap:8px;padding:0 0 8px;border-bottom:1px solid var(--border)">' +
          '<button class="btn btn-cancel" id="btn-starc-back" title="Back">←</button>' +
          '<span style="flex:1"></span>' +
          '<button class="btn btn-cancel" id="btn-starc-preview">Edit</button>' +
          '<button class="btn btn-save" id="btn-starc-save" style="display:none">Save</button>' +
        '</div>' +
        '<textarea id="kdoc-content" style="flex:1;width:100%;padding:8px;margin-top:6px;background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:var(--fs-md);line-height:1.6;resize:none;display:none">' + escHtml(content) + '</textarea>' +
        '<div id="kdoc-preview" class="modal-markdown" style="flex:1;width:100%;padding:8px;margin-top:6px;overflow:auto"></div>' +
        '</div>';
      $('#btn-starc-back').addEventListener('click', function() {
        // Dirty check: leaving the editor must not silently discard typing.
        var ta = $('#kdoc-content');
        if (ta && ta.value !== content && !confirm('Discard unsaved changes?')) return;
        reloadDocTab(path);
      });
      wireMarkdownPreview('btn-starc-preview', 'kdoc-content', 'kdoc-preview', true, 'btn-starc-save');
      $('#btn-starc-save').addEventListener('click', function() {
        var self = this;
        self.disabled = true; self.textContent = 'Saving...';
        fetch('/api/docs/' + encodeURIComponent(path), {
          method: 'PUT', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({content: $('#kdoc-content').value})
        }).then(function(r) { return r.json(); })
          .then(function() { showToast('Saved'); reloadDocTab(path); })
          .catch(function() { showToast('Save failed', 'warn'); self.disabled = false; self.textContent = 'Save'; });
      });
    })
    .catch(function() { showToast('Failed to load doc', 'warn'); reloadDocTab(path); });
}

function deleteDoc(path) {
  if (!confirm('Delete ' + path + '?')) return;
  fetch('/api/docs/' + encodeURIComponent(path), { method: 'DELETE' })
    .then(function(r) { return r.json(); })
    .then(function() { showToast('Deleted'); reloadDocTab(path); })

function loadContextMemories(filter) {
  var container = $('#consult-memory-list');

    .then(function(r) { return r.json(); })

      var memories = (data && data.memories) || [];
      if (filter && filter.trim()) {
        var q = filter.trim().toLowerCase();
        memories = memories.filter(function(m) {
          return (m.content || '').toLowerCase().includes(q) ||
                 (m.person || '').toLowerCase().includes(q) ||

      });
      var html = '';

        var statusColor = m.suggested ? 'var(--warning)' : m.disputed ? 'var(--danger)' : 'var(--success)';

          '</div>' +
          '<div class="mem-content">' + escHtml(m.content || '') + '</div>' +

            (m.suggested ? '<button class="btn-small" onclick="memAction(\'confirm\',\'' + escHtml(jsStr(m.id)) + '\')">确认</button>' : '') +
            '<button class="btn-small" onclick="memAction(\'dispute\',\'' + escHtml(jsStr(m.id)) + '\')">不准确</button>' +
            '<button class="btn-small danger" onclick="memAction(\'delete\',\'' + escHtml(jsStr(m.id)) + '\')">删除</button>' +
          '</div>' +
          '</div>' +
        '</div>';
      });
      container.innerHTML = html;
      container.querySelectorAll('.mem-card').forEach(function(el) {
        var sx = 0, sy = 0;
        el.addEventListener('touchstart', function(e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
        el.addEventListener('touchmove', function(e) {
          var dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
          if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 5) {
            if (dx < -30) el.classList.add('swiped'); else if (dx > 10) el.classList.remove('swiped');
          }
        }, {passive:true});
        el.addEventListener('touchend', function() {
          if (el.classList.contains('swiped')) { clearTimeout(el._st); el._st = setTimeout(function() { el.classList.remove('swiped'); }, 1200); }
        });
        el.addEventListener('click', function(e) {
          if (el.classList.contains('swiped') && e.target.closest('.swipe-bg')) {
            e.stopPropagation();
            memAction('delete', el.dataset.id);
            el.classList.remove('swiped');
          }
        });
      });
    })
    .catch(function() { container.innerHTML = '<div class="empty-state">Failed to load.</div>'; });
}

    html += '</div></div>';
